<!-- Firebase -->
<script type="module">
import { initializeApp }                           from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs,
         addDoc, updateDoc, deleteDoc,
         doc, writeBatch, query, orderBy }         from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes,
         getDownloadURL }                          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey:            "AIzaSyAP7OcgWNiq3ft7Nj8v76bgaS1TDcj_qMU",
  authDomain:        "nail-collection-634e3.firebaseapp.com",
  projectId:         "nail-collection-634e3",
  storageBucket:     "nail-collection-634e3.firebasestorage.app",
  messagingSenderId: "461688991863",
  appId:             "1:461688991863:web:1e74ea160d044b25985672"
};

const app      = initializeApp(firebaseConfig);
const firestoreDb = getFirestore(app);
const storage  = getStorage(app);
const COL      = "nail_sets";

// ── Firestore helpers ────────────────────────────────────────────────────────
async function dbGetAll() {
  const q = query(collection(firestoreDb, COL), orderBy("created_at", "desc"));
  const snap = await getDocs(q);
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function dbAdd(data)         { return await addDoc(collection(firestoreDb, COL), data); }
async function dbUpdate(id, data)  { await updateDoc(doc(firestoreDb, COL, id), data); }
async function dbDelete(id)        { await deleteDoc(doc(firestoreDb, COL, id)); }
async function dbBatchAdd(rows) {
  // Firestore batch max 500 — chunk it
  const CHUNK = 400;
  for (let i = 0; i < rows.length; i += CHUNK) {
    const batch = writeBatch(firestoreDb);
    rows.slice(i, i + CHUNK).forEach(row => {
      batch.set(doc(collection(firestoreDb, COL)), row);
    });
    await batch.commit();
  }
}

// ── Storage helper ───────────────────────────────────────────────────────────
async function uploadPhoto(file) {
  try {
    const path    = `nail-photos/${Date.now()}-${Math.random().toString(36).slice(2)}.${file.name.split('.').pop()}`;
    const storRef = ref(storage, path);
    await uploadBytes(storRef, file);
    return await getDownloadURL(storRef);
  } catch(e) {
    // Fall back to base64 if storage fails
    return await fileToBase64(file);
  }
}
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ── Cache ────────────────────────────────────────────────────────────────────
const CACHE_KEY = 'nailSetsCache_fb';
function saveCache(data) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch(e){} }
function loadCache()     { try { const d = localStorage.getItem(CACHE_KEY); return d ? JSON.parse(d) : null; } catch(e){ return null; } }

// ── State ────────────────────────────────────────────────────────────────────
let sets         = [];
let editId       = null;
let pendingPhoto = null;
let pendingFile  = null;
let pendingQty   = 1;
let activeBrand  = 'all';
let activeLength = 'all';
let activeShape  = 'all';
let activeVibes  = new Set(['all']);
let activeStatus = 'all';
let searchQ      = '';

const BRAND_LABELS  = { nailvesta:'NailVesta', nailphoria:'NailPhoria', other:'LilyNailsArt', other2:'Other' };
const BRAND_COLORS  = { nailvesta:'#7a8cb5', nailphoria:'#b5768c', other:'#9b8f6b', other2:'#8b7b8b' };
const VIBE_LABELS   = { summer:'Summer', fall:'Fall', dark:'Dark', spring:'Spring', everyday:'Everyday' };
const LENGTH_LABELS = { short:'Short', medium:'Medium', long:'Long' };
const SHAPE_LABELS  = { square:'Square', almond:'Almond', stiletto:'Stiletto' };

function shapeDisplay(length, shape) {
  return [LENGTH_LABELS[length]||'', SHAPE_LABELS[shape]||''].filter(Boolean).join(' ') || '—';
}

// ── Toast ────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (isError?' error':'');
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}

// ── Status ───────────────────────────────────────────────────────────────────
function showStatus(state, msg='') {
  const area = document.getElementById('status-area');
  const grid = document.getElementById('grid');
  if (state === 'loading') {
    area.style.display = 'block';
    area.innerHTML = '<div class="spinner"></div><h3>' + (msg||'Loading your collection…') + '</h3>';
    grid.style.display = 'none';
  } else if (state === 'error') {
    area.style.display = 'block';
    area.innerHTML = '<div class="status-icon">⚠️</div><h3>Connection error</h3><p style="font-size:0.7rem;color:#c62828;padding:0.4rem 1rem 0;word-break:break-all">' + msg + '</p>';
    grid.style.display = 'none';
  } else if (state === 'empty') {
    area.style.display = 'block';
    area.innerHTML = '<div class="status-icon">💅</div><h3>No sets found</h3><p>Try a different filter or add your first set!</p>';
    grid.style.display = 'none';
  } else {
    area.style.display = 'none';
    grid.style.display = 'grid';
  }
}

// ── Filter ───────────────────────────────────────────────────────────────────
function filtered() {
  const q = searchQ.toLowerCase();
  return sets.filter(s => {
    if (activeBrand  !== 'all' && s.brand  !== activeBrand)  return false;
    if (activeLength !== 'all' && s.length !== activeLength) return false;
    if (activeShape  !== 'all' && s.shape  !== activeShape)  return false;
    if (activeStatus !== 'all' && (s.status||'') !== activeStatus) return false;
    if (!activeVibes.has('all')) {
      const sv = (s.vibe||'').split(',').map(v=>v.trim()).filter(Boolean);
      if (!sv.some(v => activeVibes.has(v))) return false;
    }
    if (q && !s.name.toLowerCase().includes(q) && !(s.notes||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

// ── Render ───────────────────────────────────────────────────────────────────
function updateOgImage() {
  const w = sets.find(s => s.photo && s.photo.startsWith('http'));
  const t = document.querySelector('meta[property="og:image"]');
  if (t && w) t.setAttribute('content', w.photo);
}

function render() {
  const grid = document.getElementById('grid');
  const list = filtered();

  document.getElementById('total-count').textContent     = sets.length;
  document.getElementById('nailvesta-count').textContent = sets.filter(s=>s.brand==='nailvesta').length;
  document.getElementById('nailphoria-count').textContent= sets.filter(s=>s.brand==='nailphoria').length;
  document.getElementById('other-count').textContent     = sets.filter(s=>s.brand==='other').length;
  document.getElementById('other2-count').textContent    = sets.filter(s=>s.brand==='other2').length;

  grid.innerHTML = '';

  if (!list.length) { showStatus('empty'); return; }
  document.getElementById('status-area').style.display = 'none';
  grid.style.display = 'grid';

  if (activeBrand === 'all') {
    ['nailvesta','nailphoria','other','other2'].forEach(brand => {
      const group = list.filter(s => s.brand === brand);
      if (!group.length) return;
      const h = document.createElement('div');
      h.className = 'brand-heading';
      h.innerHTML = `<div class="dot" style="background:${BRAND_COLORS[brand]}"></div>
        <h2 style="color:${BRAND_COLORS[brand]}">${BRAND_LABELS[brand]}</h2>
        <span class="count">${group.length} set${group.length!==1?'s':''}</span>`;
      grid.appendChild(h);
      group.forEach(s => grid.appendChild(makeCard(s)));
    });
  } else {
    list.forEach(s => grid.appendChild(makeCard(s)));
  }
}

function makeCard(s) {
  const card = document.createElement('div');
  card.className = 'card' + (s.status==='worn' ? ' status-worn' : s.status==='archived' ? ' status-archived' : '');
  card.style.animationDelay = Math.random()*0.07+'s';

  const qty = (s.quantity||1) > 1 ? `<span style="margin-left:0.3rem;font-size:0.6rem;font-weight:500;color:var(--mauve);background:var(--blush);padding:0.14rem 0.45rem;border-radius:999px;">×${s.quantity}</span>` : '';
  const vibeHtml = s.vibe ? s.vibe.split(',').map(v=>v.trim()).filter(Boolean).map(v=>`<span style="display:inline-block;margin:0.2rem 0.2rem 0 0;font-size:0.56rem;letter-spacing:0.07em;color:var(--mauve);background:var(--blush);padding:0.1rem 0.45rem;border-radius:999px;">${VIBE_LABELS[v]||v}</span>`).join('') : '';
  const imgHTML = s.photo
    ? `<img class="card-img" src="${s.photo}" alt="${s.name}" data-lb />`
    : `<div class="card-img-placeholder" data-edit>💅<span>Add Photo</span></div>`;

  card.innerHTML = `${imgHTML}
    <div class="card-body">
      <span class="card-brand-badge badge-${s.brand}">${BRAND_LABELS[s.brand]||s.brand}</span>${qty}
      <div class="card-name">${s.name}</div>
      <div class="card-shape">${shapeDisplay(s.length, s.shape)}</div>
      ${vibeHtml}
      ${s.notes?`<div class="card-notes">${s.notes}</div>`:''}
      <div class="card-actions">
        <button class="card-btn" data-edit>Edit</button>
        <button class="card-btn delete" data-del>Remove</button>
      </div>
    </div>`;

  const img = card.querySelector('[data-lb]');
  if (img) img.addEventListener('click', () => openLightbox(s.photo));
  card.querySelectorAll('[data-edit]').forEach(el => el.addEventListener('click', () => openEdit(s.id)));
  card.querySelector('[data-del]').addEventListener('click', () => handleDelete(s.id, s.name));
  return card;
}

// ── CRUD ─────────────────────────────────────────────────────────────────────
async function handleSave() {
  const name   = document.getElementById('f-name').value.trim();
  const brand  = document.getElementById('f-brand').value;
  const length = document.getElementById('f-length').value;
  const shape  = document.getElementById('f-shape').value;
  const notes  = document.getElementById('f-notes').value.trim();
  if (!name||!brand||!length||!shape) { showToast('Please fill in name, brand, length, and shape.', true); return; }

  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true; saveBtn.textContent = 'Saving…';

  let photoUrl = pendingPhoto;
  if (pendingFile) photoUrl = await uploadPhoto(pendingFile);

  const vibe   = [...document.querySelectorAll('.modal-vibe-pill.active')].map(p=>p.dataset.vibe).join(',');
  const status = document.querySelector('.modal-status-pill.active')?.dataset.status || '';
  const payload = {
    name, brand, length, shape,
    vibe:     vibe   || null,
    status:   status || null,
    notes:    notes  || null,
    photo:    photoUrl || null,
    quantity: pendingQty
  };

  try {
    if (editId) {
      await dbUpdate(editId, payload);
      const idx = sets.findIndex(s=>s.id===editId);
      sets[idx] = { ...sets[idx], ...payload };
      showToast('Set updated! ✦');
    } else {
      payload.created_at = new Date().toISOString();
      const ref = await dbAdd(payload);
      sets.unshift({ id: ref.id, ...payload });
      showToast('Set added! 💅');
    }
    saveCache(sets);
    closeModal(); render();
  } catch(err) {
    showToast('Error: ' + err.message, true);
  }

  saveBtn.disabled = false; saveBtn.textContent = 'Save Set ✦';
}

async function handleDelete(id, name) {
  if (!confirm(`Remove "${name}"?`)) return;
  try {
    await dbDelete(id);
    sets = sets.filter(s=>s.id!==id);
    saveCache(sets);
    showToast('Set removed.');
    render();
  } catch(err) { showToast('Error: '+err.message, true); }
}

// ── Import from JSON (migrate from Supabase export) ──────────────────────────
async function handleImport(file) {
  showStatus('loading', 'Importing your collection…');
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!Array.isArray(data)) throw new Error('Invalid file format');

    const rows = data.map(s => ({
      name:       s.name       || '',
      brand:      s.brand      || 'nailvesta',
      length:     s.length     || '',
      shape:      s.shape      || '',
      notes:      s.notes      || null,
      photo:      s.photo      || null,
      vibe:       s.vibe       || null,
      status:     s.status     || null,
      quantity:   s.quantity   || 1,
      created_at: s.created_at || new Date().toISOString()
    }));

    await dbBatchAdd(rows);
    showToast(`Imported ${rows.length} sets! 💅`);
    // Reload from Firestore to get real IDs
    sets = await dbGetAll();
    saveCache(sets);
    showStatus('done');
    render();
    updateOgImage();
  } catch(err) {
    showToast('Import failed: ' + err.message, true);
    showStatus('done');
    render();
  }
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal() {
  editId=null; pendingPhoto=null; pendingFile=null; pendingQty=1;
  document.getElementById('modal-title').textContent = 'Add New Set';
  ['f-name','f-notes'].forEach(id=>document.getElementById(id).value='');
  ['f-brand','f-length','f-shape'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-photo').value='';
  document.getElementById('upload-text').textContent='Click to upload a photo';
  document.getElementById('qty-display').textContent=1;
  const prev=document.getElementById('photo-preview');
  prev.classList.remove('visible'); prev.src='';
  document.querySelectorAll('.modal-vibe-pill').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.modal-status-pill').forEach(p=>{ p.classList.remove('active'); p.style.background='white'; });
  document.querySelector('.modal-status-pill[data-status=""]').classList.add('active');
  document.getElementById('modal-overlay').classList.add('open');
}

function openEdit(id) {
  const s=sets.find(x=>x.id===id); if(!s) return;
  editId=id; pendingPhoto=s.photo||null; pendingFile=null; pendingQty=s.quantity||1;
  document.getElementById('modal-title').textContent='Edit Set';
  document.getElementById('f-name').value=s.name;
  document.getElementById('f-brand').value=s.brand;
  document.getElementById('f-length').value=s.length||'';
  document.getElementById('f-shape').value=s.shape||'';
  document.getElementById('f-notes').value=s.notes||'';
  document.getElementById('f-photo').value='';
  document.getElementById('upload-text').textContent=s.photo?'Click to replace photo':'Click to upload a photo';
  document.getElementById('qty-display').textContent=pendingQty;
  const prev=document.getElementById('photo-preview');
  if(s.photo){prev.src=s.photo;prev.classList.add('visible');}else prev.classList.remove('visible');
  document.querySelectorAll('.modal-vibe-pill').forEach(p=>{
    const vibes=(s.vibe||'').split(',').map(v=>v.trim());
    p.classList.toggle('active', vibes.includes(p.dataset.vibe));
  });
  document.querySelectorAll('.modal-status-pill').forEach(p=>{
    const active=(p.dataset.status||'')===(s.status||'');
    p.classList.toggle('active', active);
    if(active){
      if(p.dataset.status==='worn') p.style.background='#e8f5ee';
      else if(p.dataset.status==='archived') p.style.background='#fdeaea';
      else p.style.background='white';
    } else { p.style.background='white'; }
  });
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() { document.getElementById('modal-overlay').classList.remove('open'); }

// ── Lightbox ──────────────────────────────────────────────────────────────────
function openLightbox(src) {
  document.getElementById('lightbox-img').src=src;
  document.getElementById('lightbox').classList.add('open');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
async function boot() {
  // Show cache instantly if available
  const cached = loadCache();
  if (cached !== null) {
    sets = cached;
    showStatus('done');
    render();
    updateOgImage();
    // Refresh from Firestore silently in background
    dbGetAll().then(fresh => {
      sets = fresh;
      saveCache(fresh);
      render();
      updateOgImage();
    }).catch(err => console.warn('Background refresh failed:', err.message));
    return;
  }
  // First ever load
  showStatus('loading');
  try {
    sets = await dbGetAll();
    saveCache(sets);
    showStatus('done');
    render();
    updateOgImage();
  } catch(err) {
    showStatus('error', err.message);
  }
}

// ── Event listeners ───────────────────────────────────────────────────────────
document.getElementById('open-modal').addEventListener('click', openModal);
document.getElementById('close-modal').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });
document.getElementById('save-btn').addEventListener('click', handleSave);
document.getElementById('lightbox-close').addEventListener('click', ()=>document.getElementById('lightbox').classList.remove('open'));
document.getElementById('lightbox').addEventListener('click', e=>{ if(e.target===e.currentTarget) e.currentTarget.classList.remove('open'); });

document.getElementById('f-photo').addEventListener('change', async e=>{
  const file=e.target.files[0]; if(!file) return;
  pendingFile=file;
  document.getElementById('upload-text').textContent=file.name;
  pendingPhoto=await fileToBase64(file);
  const prev=document.getElementById('photo-preview');
  prev.src=pendingPhoto; prev.classList.add('visible');
});

document.getElementById('qty-minus').addEventListener('click', ()=>{
  if(pendingQty>1){ pendingQty--; document.getElementById('qty-display').textContent=pendingQty; }
});
document.getElementById('qty-plus').addEventListener('click', ()=>{
  pendingQty++; document.getElementById('qty-display').textContent=pendingQty;
});

document.querySelectorAll('.modal-status-pill').forEach(pill=>{
  pill.addEventListener('click', ()=>{
    document.querySelectorAll('.modal-status-pill').forEach(p=>{ p.classList.remove('active'); p.style.background='white'; });
    pill.classList.add('active');
    if(pill.dataset.status==='worn') pill.style.background='#e8f5ee';
    else if(pill.dataset.status==='archived') pill.style.background='#fdeaea';
  });
});

document.querySelectorAll('.modal-vibe-pill').forEach(pill=>{
  pill.addEventListener('click', ()=>pill.classList.toggle('active'));
});

document.querySelectorAll('.brand-tab').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.brand-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); activeBrand=btn.dataset.brand; render();
  });
});

document.querySelectorAll('[data-tier="length"]').forEach(pill=>{
  pill.addEventListener('click', ()=>{
    document.querySelectorAll('[data-tier="length"]').forEach(p=>p.classList.remove('active'));
    pill.classList.add('active'); activeLength=pill.dataset.val; render();
  });
});

document.querySelectorAll('[data-tier="shape"]').forEach(pill=>{
  pill.addEventListener('click', ()=>{
    document.querySelectorAll('[data-tier="shape"]').forEach(p=>p.classList.remove('active'));
    pill.classList.add('active'); activeShape=pill.dataset.val; render();
  });
});

document.querySelectorAll('[data-tier="vibe"]').forEach(pill=>{
  pill.addEventListener('click', ()=>{
    const val=pill.dataset.val;
    if(val==='all'){
      activeVibes=new Set(['all']);
      document.querySelectorAll('[data-tier="vibe"]').forEach(p=>p.classList.remove('active'));
      pill.classList.add('active');
    } else {
      activeVibes.delete('all');
      document.querySelector('[data-tier="vibe"][data-val="all"]').classList.remove('active');
      if(activeVibes.has(val)){ activeVibes.delete(val); pill.classList.remove('active'); }
      else { activeVibes.add(val); pill.classList.add('active'); }
      if(activeVibes.size===0){ activeVibes.add('all'); document.querySelector('[data-tier="vibe"][data-val="all"]').classList.add('active'); }
    }
    render();
  });
});

document.querySelectorAll('[data-tier="status"]').forEach(pill=>{
  pill.addEventListener('click', ()=>{
    document.querySelectorAll('[data-tier="status"]').forEach(p=>p.classList.remove('active'));
    pill.classList.add('active'); activeStatus=pill.dataset.val; render();
  });
});

document.getElementById('search').addEventListener('input', e=>{ searchQ=e.target.value; render(); });

// Export
document.getElementById('export-btn').addEventListener('click', ()=>{
  if(!sets||sets.length===0){ showToast('No sets loaded yet.', true); return; }
  const blob=new Blob([JSON.stringify(sets,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='nail-collection-export.json'; a.click();
  URL.revokeObjectURL(url);
  showToast(`Exported ${sets.length} sets ✦`);
});

// Import
document.getElementById('import-input').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  if(!confirm(`This will import all sets from the file into Firebase. Continue?`)) return;
  handleImport(file);
  e.target.value='';
});

boot();
</script>

<style>
  :root {
    --cream: #fdf8f4; --blush: #f2d6d0; --rose: #c9837a;
    --mauve: #9b6b74; --deep: #3d2229;
    --nailphoria: #b5768c; --nailvesta: #7a8cb5;
    --other: #9b8f6b; --other2: #8b7b8b;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Jost',sans-serif; background:var(--cream); color:var(--deep); min-height:100vh; overflow-x:hidden; touch-action:pan-x pan-y; }
  body::before { content:''; position:fixed; top:-40%; right:-20%; width:80vw; height:80vw; background:radial-gradient(ellipse,#f7e0dc 0%,transparent 65%); pointer-events:none; z-index:0; }
  body::after  { content:''; position:fixed; bottom:-30%; left:-15%; width:60vw; height:60vw; background:radial-gradient(ellipse,#dfe4f2 0%,transparent 65%); pointer-events:none; z-index:0; }
  .wrap { position:relative; z-index:1; max-width:900px; margin:0 auto; padding:0 1.5rem; }

  header { padding:3rem 0 2.2rem; text-align:center; border-bottom:1px solid var(--blush); }
  .header-eyebrow { font-weight:200; letter-spacing:0.45em; font-size:0.8rem; text-transform:uppercase; color:var(--rose); margin-bottom:0.7rem; }
  header h1 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:clamp(2.8rem,7vw,5.2rem); line-height:1.08; color:var(--deep); }
  header h1 em { font-style:italic; color:var(--rose); }

  .header-stats { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); margin-top:2rem; border:1px solid var(--blush); border-radius:16px; overflow:hidden; background:white; width:100%; }
  .stat { text-align:center; padding:1.4rem 0.25rem; border-right:1px solid var(--blush); min-width:0; }
  .stat:last-child { border-right:none; }
  .stat-num { font-family:'Cormorant Garamond',serif; font-size:2.6rem; font-weight:300; color:var(--rose); line-height:1; }
  .stat-label { font-size:0.55rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--mauve); margin-top:0.35rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .controls { display:flex; flex-direction:column; gap:0.9rem; padding:1.4rem 0 0.8rem; }
  .controls-top { display:flex; align-items:center; justify-content:flex-end; gap:0.6rem; flex-wrap:wrap; }
  .brand-tabs { display:flex; gap:0.4rem; width:100%; }
  .brand-tab { flex:1; text-align:center; padding:0.42rem 0.25rem; border-radius:999px; border:1.5px solid currentColor; background:transparent; cursor:pointer; font-family:'Jost',sans-serif; font-size:0.65rem; font-weight:400; letter-spacing:0.06em; text-transform:uppercase; transition:all 0.2s; white-space:nowrap; }
  .brand-tab:hover,.brand-tab.active { color:white; }
  .brand-tab.all        { color:var(--mauve);     border-color:var(--mauve); }
  .brand-tab.nailvesta  { color:var(--nailvesta);  border-color:var(--nailvesta); }
  .brand-tab.nailphoria { color:var(--nailphoria); border-color:var(--nailphoria); }
  .brand-tab.other      { color:var(--other);      border-color:var(--other); }
  .brand-tab.other2     { color:var(--other2);     border-color:var(--other2); }
  .brand-tab.all.active,        .brand-tab.all:hover        { background:var(--mauve);     border-color:var(--mauve); }
  .brand-tab.nailvesta.active,  .brand-tab.nailvesta:hover  { background:var(--nailvesta);  border-color:var(--nailvesta); }
  .brand-tab.nailphoria.active, .brand-tab.nailphoria:hover { background:var(--nailphoria); border-color:var(--nailphoria); }
  .brand-tab.other.active,      .brand-tab.other:hover      { background:var(--other);      border-color:var(--other); }
  .brand-tab.other2.active,     .brand-tab.other2:hover     { background:var(--other2);     border-color:var(--other2); }

  .add-btn { display:flex; align-items:center; gap:0.4rem; padding:0.48rem 1.2rem; background:var(--deep); color:var(--cream); border:none; border-radius:999px; cursor:pointer; font-family:'Jost',sans-serif; font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; transition:background 0.2s,transform 0.15s; white-space:nowrap; }
  .add-btn:hover:not(:disabled) { background:var(--rose); transform:translateY(-1px); }
  .add-btn:disabled { opacity:0.5; cursor:not-allowed; }

  .filter-tiers { display:flex; flex-direction:column; gap:0.55rem; padding-bottom:1.2rem; border-bottom:1px solid var(--blush); }
  .filter-row { display:flex; align-items:center; gap:0.4rem; flex-wrap:wrap; }
  .filter-row.nowrap { flex-wrap:nowrap; }
  .filter-row-label { font-size:0.58rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--mauve); white-space:nowrap; min-width:44px; }
  .shape-pill,.vibe-pill { padding:0.3rem 0.8rem; border-radius:999px; border:1px solid var(--blush); background:white; cursor:pointer; font-family:'Jost',sans-serif; font-size:0.68rem; font-weight:400; letter-spacing:0.07em; color:var(--mauve); transition:all 0.18s; white-space:nowrap; }
  .shape-pill:hover,.vibe-pill:hover { border-color:var(--rose); color:var(--rose); }
  .shape-pill.active,.vibe-pill.active { background:var(--rose); border-color:var(--rose); color:white; }
  .vibe-pill { flex:1; text-align:center; padding:0.42rem 0.25rem; min-height:32px; display:flex; align-items:center; justify-content:center; }

  .search-wrap { position:relative; }
  .search-input { padding:0.45rem 1rem 0.45rem 2rem; border:1.5px solid var(--blush); border-radius:999px; background:white; font-family:'Jost',sans-serif; font-size:16px; color:var(--deep); width:180px; transition:border-color 0.18s; }
  .search-input:focus { outline:none; border-color:var(--rose); }
  .search-icon { position:absolute; left:0.65rem; top:50%; transform:translateY(-50%); color:var(--rose); font-size:0.8rem; pointer-events:none; }

  .status-state { text-align:center; padding:4rem 2rem; }
  .status-icon { font-size:2.5rem; margin-bottom:0.8rem; }
  .status-state h3 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:1.5rem; color:var(--mauve); margin-bottom:0.4rem; }
  .status-state p { font-size:0.82rem; color:var(--rose); font-weight:200; }
  .spinner { width:36px; height:36px; border:3px solid var(--blush); border-top-color:var(--rose); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 1rem; }
  @keyframes spin { to { transform:rotate(360deg); } }

  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:1rem; padding:1.4rem 0 4rem; }
  .brand-heading { grid-column:1/-1; display:flex; align-items:center; gap:0.7rem; padding-bottom:0.4rem; border-bottom:1.5px solid var(--blush); margin-top:0.6rem; }
  .brand-heading h2 { font-family:'Cormorant Garamond',serif; font-weight:400; font-style:italic; font-size:1.3rem; }
  .brand-heading .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .brand-heading .count { margin-left:auto; font-size:0.6rem; letter-spacing:0.15em; text-transform:uppercase; color:var(--mauve); }

  .card { background:white; border-radius:12px; overflow:hidden; box-shadow:0 2px 12px rgba(61,34,41,0.07); transition:transform 0.22s,box-shadow 0.22s; animation:fadeUp 0.32s ease both; }
  .card:hover { transform:translateY(-3px); box-shadow:0 6px 24px rgba(61,34,41,0.12); }
  .card.status-worn     { box-shadow:0 0 0 2px #6abf87,0 2px 12px rgba(61,34,41,0.07); }
  .card.status-archived { box-shadow:0 0 0 2px #e57373,0 2px 12px rgba(61,34,41,0.07); }
  .card.status-worn:hover     { box-shadow:0 0 0 2px #6abf87,0 6px 24px rgba(61,34,41,0.12); }
  .card.status-archived:hover { box-shadow:0 0 0 2px #e57373,0 6px 24px rgba(61,34,41,0.12); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }

  .card-img { width:100%; aspect-ratio:3/4; object-fit:cover; display:block; cursor:zoom-in; }
  .card-img-placeholder { width:100%; aspect-ratio:3/4; display:flex; flex-direction:column; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--blush),#f7eaf8); color:var(--rose); font-size:1.8rem; gap:0.4rem; cursor:pointer; }
  .card-img-placeholder span { font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; }
  .card-body { padding:0.65rem 0.75rem 0.75rem; }
  .card-brand-badge { display:inline-block; padding:0.14rem 0.55rem; border-radius:999px; font-size:0.56rem; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:0.3rem; color:white; }
  .badge-nailvesta  { background:var(--nailvesta); }
  .badge-nailphoria { background:var(--nailphoria); }
  .badge-other      { background:var(--other); }
  .badge-other2     { background:var(--other2); }
  .card-name { font-family:'Cormorant Garamond',serif; font-size:1rem; font-weight:400; line-height:1.2; color:var(--deep); margin-bottom:0.18rem; }
  .card-shape { font-size:0.6rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--rose); font-weight:300; }
  .card-notes { font-size:0.65rem; color:var(--mauve); margin-top:0.25rem; font-weight:300; }
  .card-actions { display:flex; gap:0.35rem; margin-top:0.6rem; }
  .card-btn { flex:1; padding:0.32rem 0; border-radius:7px; border:1px solid var(--blush); background:transparent; cursor:pointer; font-family:'Jost',sans-serif; font-size:0.62rem; letter-spacing:0.07em; color:var(--mauve); transition:all 0.18s; }
  .card-btn:hover { background:var(--blush); border-color:var(--rose); color:var(--deep); }
  .card-btn.delete:hover { background:#fdeaea; border-color:#e57373; color:#c62828; }

  .modal-overlay { position:fixed; inset:0; background:rgba(61,34,41,0.38); backdrop-filter:blur(6px); z-index:100; display:flex; align-items:center; justify-content:center; padding:1rem; opacity:0; pointer-events:none; transition:opacity 0.25s; }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal { background:var(--cream); border-radius:18px; padding:2rem; width:100%; max-width:440px; max-height:90vh; overflow-y:auto; box-shadow:0 24px 64px rgba(61,34,41,0.2); transform:translateY(20px) scale(0.97); transition:transform 0.25s; }
  .modal-overlay.open .modal { transform:none; }
  .modal h2 { font-family:'Cormorant Garamond',serif; font-weight:300; font-size:1.7rem; color:var(--deep); margin-bottom:1.3rem; }
  .form-group { margin-bottom:1rem; }
  .form-label { display:block; font-size:0.6rem; letter-spacing:0.16em; text-transform:uppercase; color:var(--mauve); margin-bottom:0.35rem; }
  .form-input,.form-select { width:100%; padding:0.6rem 0.85rem; border:1.5px solid var(--blush); border-radius:9px; background:white; font-family:'Jost',sans-serif; font-size:16px; color:var(--deep); transition:border-color 0.18s; appearance:none; }
  .form-input:focus,.form-select:focus { outline:none; border-color:var(--rose); }
  .form-row { display:grid; grid-template-columns:1fr 1fr; gap:0.7rem; }
  .photo-upload-area { border:2px dashed var(--blush); border-radius:11px; padding:1.5rem; text-align:center; cursor:pointer; transition:all 0.18s; position:relative; }
  .photo-upload-area:hover { border-color:var(--rose); background:#fff8f6; }
  .photo-upload-area input[type="file"] { position:absolute; inset:0; opacity:0; cursor:pointer; }
  .upload-icon { font-size:1.6rem; margin-bottom:0.3rem; }
  .upload-text { font-size:0.7rem; color:var(--mauve); }
  .photo-preview { width:100%; max-height:160px; object-fit:cover; border-radius:9px; margin-top:0.7rem; display:none; }
  .photo-preview.visible { display:block; }
  .modal-vibe-pill,.modal-status-pill { padding:0.32rem 0.85rem; border-radius:999px; border:1px solid var(--blush); background:white; cursor:pointer; font-family:'Jost',sans-serif; font-size:0.72rem; font-weight:400; letter-spacing:0.07em; color:var(--mauve); transition:all 0.18s; white-space:nowrap; min-height:32px; -webkit-appearance:none; }
  .modal-vibe-pill:hover { border-color:var(--rose); color:var(--rose); }
  .modal-vibe-pill.active { background:var(--rose); border-color:var(--rose); color:white; }
  .modal-actions { display:flex; gap:0.6rem; margin-top:1.3rem; }
  .btn-cancel { flex:1; padding:0.65rem; border-radius:9px; border:1.5px solid var(--blush); background:transparent; cursor:pointer; font-family:'Jost',sans-serif; font-size:0.78rem; color:var(--mauve); transition:background 0.18s; }
  .btn-cancel:hover { background:var(--blush); }
  .btn-save { flex:2; padding:0.65rem; border-radius:9px; border:none; background:var(--deep); color:white; cursor:pointer; font-family:'Jost',sans-serif; font-size:0.78rem; letter-spacing:0.12em; text-transform:uppercase; transition:background 0.18s; }
  .btn-save:hover:not(:disabled) { background:var(--rose); }
  .btn-save:disabled { opacity:0.55; cursor:not-allowed; }

  .lightbox { position:fixed; inset:0; background:rgba(20,10,12,0.9); z-index:200; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.2s; }
  .lightbox.open { opacity:1; pointer-events:all; }
  .lightbox img { max-width:92vw; max-height:88vh; border-radius:10px; object-fit:contain; }
  .lightbox-close { position:absolute; top:1.2rem; right:1.2rem; background:white; border:none; border-radius:50%; width:36px; height:36px; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; }

  .toast { position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%) translateY(80px); background:var(--deep); color:white; padding:0.65rem 1.4rem; border-radius:999px; font-size:0.78rem; z-index:999; transition:transform 0.3s; white-space:nowrap; pointer-events:none; }
  .toast.show { transform:translateX(-50%) translateY(0); }
  .toast.error { background:#c62828; }

  @media (max-width:600px) {
    .form-input,.form-select,.search-input { font-size:16px !important; }
    .header-stats { grid-template-columns:repeat(5,minmax(0,1fr)); }
    .stat { padding:0.9rem 0.1rem; }
    .stat-num { font-size:1.5rem; }
    .stat-label { font-size:0.46rem; letter-spacing:0.06em; }
    .controls-top { justify-content:flex-start; }
    .grid { gap:0.7rem; }
    .modal { padding:1.4rem; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-eyebrow">✦ My Collection ✦</div>
    <h1>Press-On <em>Nail Archive</em></h1>
    <div class="header-stats">
      <div class="stat"><div class="stat-num" id="total-count">—</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-num" id="nailvesta-count" style="color:var(--nailvesta)">—</div><div class="stat-label">NailVesta</div></div>
      <div class="stat"><div class="stat-num" id="nailphoria-count" style="color:var(--nailphoria)">—</div><div class="stat-label">NailPhoria</div></div>
      <div class="stat"><div class="stat-num" id="other-count" style="color:var(--other)">—</div><div class="stat-label">LNA</div></div>
      <div class="stat"><div class="stat-num" id="other2-count" style="color:var(--other2)">—</div><div class="stat-label">Other</div></div>
    </div>
  </header>

  <div class="controls">
    <div class="controls-top">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search" placeholder="Search…" />
      </div>
      <button class="add-btn" id="export-btn" style="background:#7a8cb5;">⬇ Export</button>
      <label class="add-btn" style="background:#7a9b8c;cursor:pointer;">
        ⬆ Import
        <input type="file" id="import-input" accept=".json" style="display:none;" />
      </label>
      <button class="add-btn" id="open-modal">＋ Add Set</button>
    </div>
    <div class="brand-tabs">
      <button class="brand-tab all active"  data-brand="all">All</button>
      <button class="brand-tab nailvesta"   data-brand="nailvesta">NailVesta</button>
      <button class="brand-tab nailphoria"  data-brand="nailphoria">NailPhoria</button>
      <button class="brand-tab other"       data-brand="other">LilyNailsArt</button>
      <button class="brand-tab other2"      data-brand="other2">Other</button>
    </div>
  </div>

  <div class="filter-tiers">
    <div class="filter-row">
      <span class="filter-row-label">Length</span>
      <button class="shape-pill active" data-tier="length" data-val="all">All</button>
      <button class="shape-pill" data-tier="length" data-val="short">Short</button>
      <button class="shape-pill" data-tier="length" data-val="medium">Medium</button>
      <button class="shape-pill" data-tier="length" data-val="long">Long</button>
    </div>
    <div class="filter-row">
      <span class="filter-row-label">Shape</span>
      <button class="shape-pill active" data-tier="shape" data-val="all">All</button>
      <button class="shape-pill" data-tier="shape" data-val="square">Square</button>
      <button class="shape-pill" data-tier="shape" data-val="almond">Almond</button>
      <button class="shape-pill" data-tier="shape" data-val="stiletto">Stiletto</button>
    </div>
    <div class="filter-row nowrap">
      <span class="filter-row-label">Vibe</span>
      <button class="vibe-pill active" data-tier="vibe" data-val="all">All</button>
      <button class="vibe-pill" data-tier="vibe" data-val="summer">Summer</button>
      <button class="vibe-pill" data-tier="vibe" data-val="fall">Fall</button>
      <button class="vibe-pill" data-tier="vibe" data-val="dark">Dark</button>
      <button class="vibe-pill" data-tier="vibe" data-val="spring">Spring</button>
      <button class="vibe-pill" data-tier="vibe" data-val="everyday">Everyday</button>
    </div>
    <div class="filter-row">
      <span class="filter-row-label">Status</span>
      <button class="shape-pill active" data-tier="status" data-val="all">All</button>
      <button class="shape-pill" data-tier="status" data-val="worn">Worn</button>
      <button class="shape-pill" data-tier="status" data-val="archived">Archived</button>
    </div>
  </div>

  <div id="status-area" class="status-state">
    <div class="spinner"></div>
    <h3>Loading your collection…</h3>
  </div>
  <div class="grid" id="grid" style="display:none"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2 id="modal-title">Add New Set</h2>
    <div class="form-group">
      <label class="form-label">Set Name</label>
      <input class="form-input" id="f-name" placeholder="e.g. Cherry Blossom Dreams" />
    </div>
    <div class="form-group">
      <label class="form-label">Quantity</label>
      <div style="display:flex;align-items:center;gap:0.8rem;">
        <button type="button" id="qty-minus" style="width:34px;height:34px;border-radius:50%;border:1.5px solid var(--blush);background:white;font-size:1.1rem;cursor:pointer;color:var(--mauve);display:flex;align-items:center;justify-content:center;flex-shrink:0;">−</button>
        <span id="qty-display" style="font-family:'Cormorant Garamond',serif;font-size:1.6rem;font-weight:300;color:var(--deep);min-width:24px;text-align:center;">1</span>
        <button type="button" id="qty-plus" style="width:34px;height:34px;border-radius:50%;border:1.5px solid var(--blush);background:white;font-size:1.1rem;cursor:pointer;color:var(--mauve);display:flex;align-items:center;justify-content:center;flex-shrink:0;">+</button>
        <span style="font-size:0.7rem;color:var(--mauve);">sets owned</span>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Brand</label>
      <select class="form-select" id="f-brand">
        <option value="">Select brand…</option>
        <option value="nailvesta">NailVesta</option>
        <option value="nailphoria">NailPhoria</option>
        <option value="other">LilyNailsArt</option>
        <option value="other2">Other</option>
      </select>
    </div>
    <div class="form-row form-group">
      <div>
        <label class="form-label">Length</label>
        <select class="form-select" id="f-length">
          <option value="">Select…</option>
          <option value="short">Short</option>
          <option value="medium">Medium</option>
          <option value="long">Long</option>
        </select>
      </div>
      <div>
        <label class="form-label">Shape</label>
        <select class="form-select" id="f-shape">
          <option value="">Select…</option>
          <option value="square">Square</option>
          <option value="almond">Almond</option>
          <option value="stiletto">Stiletto</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Photo</label>
      <div class="photo-upload-area">
        <input type="file" accept="image/*" id="f-photo" />
        <div class="upload-icon">📷</div>
        <div class="upload-text" id="upload-text">Click to upload a photo</div>
      </div>
      <img class="photo-preview" id="photo-preview" src="" alt="Preview" />
    </div>
    <div class="form-group">
      <label class="form-label">Vibe (optional — tap to select)</label>
      <div style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:0.1rem;">
        <button type="button" class="modal-vibe-pill" data-vibe="summer">Summer</button>
        <button type="button" class="modal-vibe-pill" data-vibe="fall">Fall</button>
        <button type="button" class="modal-vibe-pill" data-vibe="dark">Dark</button>
        <button type="button" class="modal-vibe-pill" data-vibe="spring">Spring</button>
        <button type="button" class="modal-vibe-pill" data-vibe="everyday">Everyday</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Status</label>
      <div style="display:flex;gap:0.4rem;">
        <button type="button" class="modal-status-pill active" data-status="" style="flex:1;text-align:center;padding:0.42rem 0.25rem;border-radius:999px;border:1.5px solid var(--blush);background:white;cursor:pointer;font-family:'Jost',sans-serif;font-size:0.7rem;color:var(--mauve);transition:all 0.2s;">Neutral</button>
        <button type="button" class="modal-status-pill" data-status="worn" style="flex:1;text-align:center;padding:0.42rem 0.25rem;border-radius:999px;border:1.5px solid #6abf87;background:white;cursor:pointer;font-family:'Jost',sans-serif;font-size:0.7rem;color:#4a9a67;transition:all 0.2s;">Worn</button>
        <button type="button" class="modal-status-pill" data-status="archived" style="flex:1;text-align:center;padding:0.42rem 0.25rem;border-radius:999px;border:1.5px solid #e57373;background:white;cursor:pointer;font-family:'Jost',sans-serif;font-size:0.7rem;color:#c62828;transition:all 0.2s;">Archived</button>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Notes (optional)</label>
      <input class="form-input" id="f-notes" placeholder="e.g. worn for wedding, fave finish…" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="close-modal">Cancel</button>
      <button class="btn-save" id="save-btn">Save Set ✦</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close">✕</button>
  <img id="lightbox-img" src="" alt="" />
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>
</body>
</html>
